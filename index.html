<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heu Abrechnung</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        h1, h2, h3 { color: #2c3e50; }
        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        input[type="file"], input[type="text"], input[type="number"], select {
            display: block;
            margin-bottom: 15px;
            font-size: 16px;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            background: white;
        }
        
        .setting-group { margin-bottom: 12px; }
        .setting-group label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .settings-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }
        @media (min-width: 600px) {
            .settings-grid { grid-template-columns: 1fr 1fr; }
        }

        .horse-checkbox-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 8px;
            background: #fafafa;
        }
        @media (min-width: 600px) {
            .horse-checkbox-list { grid-template-columns: 1fr 1fr; }
        }
        .horse-checkbox-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 14px;
            background: white;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #eee;
        }
        .horse-checkbox-item div {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .horse-checkbox-item input {
            width: 18px;
            height: 18px;
            margin: 0;
        }
        .btn-action-group {
            display: flex;
            gap: 5px;
        }
        .btn-edit {
            background: #f39c12;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-edit:hover { background: #d68910; }
        .btn-delete {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-delete:hover { background: #c0392b; }

        textarea {
            width: 100%;
            height: 280px;
            font-family: monospace;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            resize: vertical;
        }
        .table-responsive {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-bottom: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }
        th, td {
            border-bottom: 1px solid #ddd;
            border-right: 1px solid #ddd;
            padding: 10px;
            text-align: left;
            font-size: 14px;
        }
        th {
            background-color: #2c3e50;
            color: white;
            white-space: nowrap;
        }
        tr:last-child td { border-bottom: none; }
        td:last-child, th:last-child { border-right: none; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        
        .btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            transition: background-color 0.2s ease;
            margin-bottom: 10px;
        }
        .btn:hover { background-color: #219150; }
        .btn-blue { background-color: #3498db; }
        .btn-blue:hover { background-color: #2980b9; }
        .empty-state { color: #7f8c8d; font-style: italic; }
    </style>
</head>
<body>

    <h1>🌾 Heu Abrechnung</h1>

    <div class="card">
        <label style="font-weight:bold; margin-bottom: 5px; display:block;">JSON Datei hochladen:</label>
        <input type="file" id="fileInput" accept=".json">
    </div>

    <div class="card" id="settingsCard" style="display: none;">
        <h2>⚙️ Einstellungen & Verwaltung</h2>
        
        <div class="settings-grid" style="margin-bottom: 20px;">
            <div class="setting-group">
                <label for="edit_preis">Preis aktueller Ballen (€):</label>
                <input type="number" step="0.50" id="edit_preis">
            </div>
            <div class="setting-group">
                <label for="edit_anfahrt">Anfahrt gesamt (€):</label>
                <input type="number" step="1.00" id="edit_anfahrt">
            </div>
        </div>
        
        <h3 style="font-size: 16px; border-bottom: 1px solid #eee; padding-bottom: 5px; margin-top: 15px;">Ballen Verteilung (Aktuell)</h3>
        <div class="settings-grid" id="settingsContainer" style="margin-bottom: 20px;"></div>

        <h3 style="font-size: 16px; border-bottom: 1px solid #eee; padding-bottom: 5px;">🔄 Nachverrechnung Alt-Heu</h3>
        <div class="settings-grid" style="margin-bottom: 15px;">
            <div class="setting-group">
                <label for="edit_alt_mengen">Anzahl alte Ballen:</label>
                <input type="number" step="1" id="edit_alt_mengen" value="0">
            </div>
            <div class="setting-group">
                <label for="edit_alt_preis">Preis pro altem Ballen (€):</label>
                <input type="number" step="0.50" id="edit_alt_preis" value="60">
            </div>
        </div>

        <h3 style="font-size: 16px; border-bottom: 1px solid #eee; padding-bottom: 5px;">🐴 Pferde & Neue-Markierung</h3>
        <div class="setting-group">
            <label>Pferde-Liste (Haken setzen = Neues Pferd für Alt-Heu Nachverrechnung):</label>
            <div class="horse-checkbox-list" id="horseCheckboxesContainer"></div>
        </div>

        <!-- FORMULAR FÜR HINZUFÜGEN / BEARBEITEN -->
        <div style="background: #f1f8e9; padding: 15px; border-radius: 8px; border: 1px solid #c8e6c9; margin-top: 15px;" id="formCard">
            <h4 style="margin: 0 0 10px 0; color: #2e7d32;" id="formTitle">➕ Neues Pferd hinzufügen</h4>
            <input type="hidden" id="edit_b_index" value="-1">
            <input type="hidden" id="edit_p_index" value="-1">
            
            <input type="text" id="new_besitzer" placeholder="Besitzer Name (z.B. Besitzer 13)">
            <input type="text" id="new_pferd" placeholder="Pferd Name (z.B. Pferd O)">
            
            <!-- PADDOCK AUSWAHL / NEU ANLEGEN -->
            <label for="new_paddock_select" style="font-weight:bold; font-size:14px; margin-bottom:5px; display:block;">Paddock auswählen:</label>
            <select id="new_paddock_select">
                <!-- Wird dynamisch gefüllt -->
            </select>
            <input type="text" id="new_paddock_custom" placeholder="Namen für neuen Paddock eingeben..." style="display: none;">

            <label style="display: flex; align-items: center; gap: 8px; font-weight: normal; margin-bottom: 15px;">
                <input type="checkbox" id="new_stallgasse" style="width: 18px; height: 18px; margin:0;" checked> Bezieht Stallgassenheu
            </label>
            <label style="display: flex; align-items: center; gap: 8px; font-weight: normal; margin-bottom: 15px;">
                <input type="checkbox" id="new_is_neu" style="width: 18px; height: 18px; margin:0;"> Ist ein neues Pferd (für Alt-Heu)
            </label>
            <div style="display: flex; gap: 10px;">
                <button type="button" class="btn" style="background-color: #2e7d32; margin: 0;" id="saveHorseBtn">Pferd hinzufügen</button>
                <button type="button" class="btn" style="background-color: #7f8c8d; margin: 0; display: none;" id="cancelEditBtn">Abbrechen</button>
            </div>
        </div>

        <div style="margin-top: 20px;">
            <button type="button" class="btn btn-blue" id="downloadJsonBtn">💾 Aktualisierte JSON Herunterladen</button>
        </div>
    </div>

    <div class="card">
        <h2>💬 Text für WhatsApp / Chat</h2>
        <textarea id="chatOutput" readonly placeholder="Lade eine Datei hoch, um das Ergebnis zu sehen..."></textarea>
        <button id="copyChatBtn" class="btn btn-blue" style="display: none; margin-top: 15px;">Text kopieren</button>
    </div>

    <div class="card">
        <h2>📊 Übersicht & CSV Export</h2>
        <div class="table-responsive" id="tableContainer">
            <div style="padding: 10px;" class="empty-state">Lade eine Datei hoch, um die Tabelle zu sehen...</div>
        </div>
        <button id="downloadCsvBtn" class="btn" style="display: none;">CSV Herunterladen</button>
    </div>

    <script>
        let currentData = null;

        function round2(num) {
            return Math.round((num + Number.EPSILON) * 100) / 100;
        }

        document.getElementById('fileInput').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    currentData = JSON.parse(e.target.result);
                    renderSettings();
                    berechne(currentData);
                } catch (error) {
                    alert("Fehler beim Lesen der JSON-Datei. Ist das Format gültig?");
                    console.error(error);
                }
            };
            reader.readAsText(file);
        });

        function renderSettings() {
            if (!currentData) return;

            const card = document.getElementById('settingsCard');
            const container = document.getElementById('settingsContainer');
            
            document.getElementById('edit_preis').value = currentData.preisProBallen;
            document.getElementById('edit_preis').oninput = triggerLiveCalc;

            document.getElementById('edit_anfahrt').value = currentData.anfahrtKosten;
            document.getElementById('edit_anfahrt').oninput = triggerLiveCalc;

            if (currentData.nachverrechnung === undefined) {
                currentData.nachverrechnung = { menge: 0, preis: 60 };
            }

            document.getElementById('edit_alt_mengen').value = currentData.nachverrechnung.menge;
            document.getElementById('edit_alt_preis').value = currentData.nachverrechnung.preis;

            document.getElementById('edit_alt_mengen').oninput = triggerLiveCalc;
            document.getElementById('edit_alt_preis').oninput = triggerLiveCalc;

            let html = '';
            for (const [ort, ballen] of Object.entries(currentData.verteilung)) {
                const safeId = "edit_ort_" + ort.replace(/\s+/g, '_'); 
                html += `
                    <div class="setting-group">
                        <label for="${safeId}">${ort} (Anzahl):</label>
                        <input type="number" step="1" id="${safeId}" data-ort="${ort}" value="${ballen}">
                    </div>
                `;
            }
            container.innerHTML = html;

            updatePaddockSelect();
            renderHorseList();
            card.style.display = 'block';

            container.querySelectorAll('input[type="number"][data-ort]').forEach(input => {
                input.addEventListener('input', triggerLiveCalc);
            });
        }

        function updatePaddockSelect(selectedPaddock = '') {
            const select = document.getElementById('new_paddock_select');
            let optionsHtml = '';
            
            for (const ort of Object.keys(currentData.verteilung)) {
                if (ort.toLowerCase() === 'stallgasse') continue;
                const sel = (ort === selectedPaddock) ? 'selected' : '';
                optionsHtml += `<option value="${ort}" ${sel}>${ort}</option>`;
            }
            optionsHtml += `<option value="__NEW__">➕ Neuer Paddock anlegen...</option>`;
            select.innerHTML = optionsHtml;

            select.onchange = function() {
                const customInput = document.getElementById('new_paddock_custom');
                if (this.value === '__NEW__') {
                    customInput.style.display = 'block';
                    customInput.focus();
                } else {
                    customInput.style.display = 'none';
                    customInput.value = '';
                }
            };
        }

        function renderHorseList() {
            const horseContainer = document.getElementById('horseCheckboxesContainer');
            let horseHtml = '';
            currentData.besitzer.forEach((besitzer, bIndex) => {
                besitzer.pferde.forEach((pferd, pIndex) => {
                    const isChecked = pferd.neu ? 'checked' : '';
                    const stallInfo = pferd.stallgasse ? 'Stallgasse' : 'Nur Paddock';
                    horseHtml += `
                        <div class="horse-checkbox-item">
                            <div>
                                <input type="checkbox" class="horse-neu-checkbox" data-bindex="${bIndex}" data-pindex="${pIndex}" ${isChecked}>
                                <span><strong>${pferd.name}</strong> <small>(${besitzer.name} - ${stallInfo}, ${pferd.paddock})</small></span>
                            </div>
                            <div class="btn-action-group">
                                <button type="button" class="btn-edit" onclick="editPferd(${bIndex}, ${pIndex})">Ändern</button>
                                <button type="button" class="btn-delete" onclick="deletePferd(${bIndex}, ${pIndex})">Löschen</button>
                            </div>
                        </div>
                    `;
                });
            });
            horseContainer.innerHTML = horseHtml;

            horseContainer.querySelectorAll('.horse-neu-checkbox').forEach(chk => {
                chk.addEventListener('change', triggerLiveCalc);
            });
        }

        window.deletePferd = function(bIndex, pIndex) {
            if (!confirm("Möchtest du dieses Pferd wirklich löschen?")) return;
            currentData.besitzer[bIndex].pferde.splice(pIndex, 1);
            if (currentData.besitzer[bIndex].pferde.length === 0) {
                currentData.besitzer.splice(bIndex, 1);
            }
            renderSettings();
            triggerLiveCalc();
        };

        window.editPferd = function(bIndex, pIndex) {
            const besitzer = currentData.besitzer[bIndex];
            const pferd = besitzer.pferde[pIndex];

            document.getElementById('edit_b_index').value = bIndex;
            document.getElementById('edit_p_index').value = pIndex;

            document.getElementById('new_besitzer').value = besitzer.name;
            document.getElementById('new_pferd').value = pferd.name;
            
            updatePaddockSelect(pferd.paddock);
            document.getElementById('new_paddock_custom').style.display = 'none';
            document.getElementById('new_paddock_custom').value = '';

            document.getElementById('new_stallgasse').checked = pferd.stallgasse;
            document.getElementById('new_is_neu').checked = pferd.neu || false;

            document.getElementById('formTitle').innerText = "✏️ Pferd bearbeiten";
            document.getElementById('saveHorseBtn').innerText = "Änderungen speichern";
            document.getElementById('cancelEditBtn').style.display = "block";
            
            document.getElementById('formCard').scrollIntoView({ behavior: 'smooth' });
        };

        document.getElementById('cancelEditBtn').addEventListener('click', function() {
            resetForm();
        });

        function resetForm() {
            document.getElementById('edit_b_index').value = "-1";
            document.getElementById('edit_p_index').value = "-1";
            document.getElementById('new_besitzer').value = '';
            document.getElementById('new_pferd').value = '';
            
            updatePaddockSelect();
            document.getElementById('new_paddock_custom').style.display = 'none';
            document.getElementById('new_paddock_custom').value = '';

            document.getElementById('new_stallgasse').checked = true;
            document.getElementById('new_is_neu').checked = false;

            document.getElementById('formTitle').innerText = "➕ Neues Pferd hinzufügen";
            document.getElementById('saveHorseBtn').innerText = "Pferd hinzufügen";
            document.getElementById('cancelEditBtn').style.display = "none";
        }

        document.getElementById('saveHorseBtn').addEventListener('click', function() {
            if (!currentData) {
                alert("Bitte lade erst eine JSON-Datei hoch!");
                return;
            }
            const bName = document.getElementById('new_besitzer').value.trim();
            const pName = document.getElementById('new_pferd').value.trim();
            
            let paddock = document.getElementById('new_paddock_select').value;
            if (paddock === '__NEW__') {
                paddock = document.getElementById('new_paddock_custom').value.trim();
            }

            const stallgasse = document.getElementById('new_stallgasse').checked;
            const isNeu = document.getElementById('new_is_neu').checked;

            const bIdx = parseInt(document.getElementById('edit_b_index').value);
            const pIdx = parseInt(document.getElementById('edit_p_index').value);

            if (!bName || !pName || !paddock) {
                alert("Bitte fülle Besitzer, Pferdename und Paddock aus.");
                return;
            }

            if (!currentData.verteilung[paddock]) {
                currentData.verteilung[paddock] = 1;
            }

            if (bIdx > -1 && pIdx > -1) {
                const oldBesitzer = currentData.besitzer[bIdx];
                oldBesitzer.pferde.splice(pIdx, 1);
                if (oldBesitzer.pferde.length === 0) {
                    currentData.besitzer.splice(bIdx, 1);
                }
            }
            
            let besitzerObj = currentData.besitzer.find(b => b.name.toLowerCase() === bName.toLowerCase());
            if (besitzerObj) {
                besitzerObj.pferde.push({ name: pName, stallgasse: stallgasse, paddock: paddock, neu: isNeu });
            } else {
                currentData.besitzer.push({
                    name: bName,
                    pferde: [{ name: pName, stallgasse: stallgasse, paddock: paddock, neu: isNeu }]
                });
            }

            resetForm();
            renderSettings();
            triggerLiveCalc();
        });

        function triggerLiveCalc() {
            if (!currentData) return;

            currentData.preisProBallen = parseFloat(document.getElementById('edit_preis').value) || 0;
            currentData.anfahrtKosten = parseFloat(document.getElementById('edit_anfahrt').value) || 0;
            
            currentData.nachverrechnung = {
                menge: parseInt(document.getElementById('edit_alt_mengen').value) || 0,
                preis: parseFloat(document.getElementById('edit_alt_preis').value) || 0
            };

            document.querySelectorAll('#settingsContainer input[type="number"][data-ort]').forEach(input => {
                const ort = input.getAttribute('data-ort');
                currentData.verteilung[ort] = parseInt(input.value) || 0;
            });

            document.querySelectorAll('.horse-neu-checkbox').forEach(chk => {
                const bIdx = chk.getAttribute('data-bindex');
                const pIdx = chk.getAttribute('data-pindex');
                currentData.besitzer[bIdx].pferde[pIdx].neu = chk.checked;
            });

            berechne(currentData);
        }

        document.getElementById('downloadJsonBtn').addEventListener('click', function() {
            if (!currentData) return;
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentData, null, 2));
            const a = document.createElement('a');
            a.href = dataStr;
            a.download = "daten.json";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });

        document.getElementById('copyChatBtn').addEventListener('click', function() {
            const text = document.getElementById('chatOutput').value;
            if (!text) return;
            const btn = document.getElementById('copyChatBtn');
            const originalHTML = btn.innerHTML;
            
            const showSuccess = () => {
                btn.innerHTML = 'Kopiert!';
                btn.style.backgroundColor = '#27ae60';
                setTimeout(() => {
                    btn.innerHTML = originalHTML;
                    btn.style.backgroundColor = '';
                }, 2000);
            };

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(showSuccess).catch(() => fallbackCopy(text, showSuccess));
            } else {
                fallbackCopy(text, showSuccess);
            }
        });

        function fallbackCopy(text, successCallback) {
            const tempTextArea = document.createElement("textarea");
            tempTextArea.value = text;
            tempTextArea.style.position = "fixed"; 
            tempTextArea.style.top = "0";
            tempTextArea.style.left = "-9999px";
            document.body.appendChild(tempTextArea);
            tempTextArea.focus();
            tempTextArea.select();
            try {
                if (document.execCommand('copy')) successCallback();
            } catch (err) { alert('Kopieren fehlgeschlagen.'); }
            document.body.removeChild(tempTextArea);
        }

        function berechne(data) {
            let totalPferde = 0;
            let stallgassePferdeList = [];
            let neuePferdeList = [];
            let altePferdeList = [];
            const paddockPferdeCount = {};

            data.besitzer.forEach(besitzer => {
                besitzer.pferde.forEach(pferd => {
                    totalPferde++;
                    if (pferd.stallgasse) {
                        stallgassePferdeList.push({ besitzer: besitzer.name, pferd: pferd.name });
                        if (pferd.neu) {
                            neuePferdeList.push({ besitzer: besitzer.name, pferd: pferd.name });
                        } else {
                            altePferdeList.push({ besitzer: besitzer.name, pferd: pferd.name });
                        }
                    }
                    if (pferd.paddock) {
                        paddockPferdeCount[pferd.paddock] = (paddockPferdeCount[pferd.paddock] || 0) + 1;
                    }
                });
            });

            const anfahrtProPferd = totalPferde > 0 ? round2(data.anfahrtKosten / totalPferde) : 0;
            const stallgasseKosten = (data.verteilung["Stallgasse"] || 0) * data.preisProBallen;
            const stallgasseProPferd = stallgassePferdeList.length > 0 ? round2(stallgasseKosten / stallgassePferdeList.length) : 0;

            const paddockKostenProPferd = {};
            for (const [paddockName, ballen] of Object.entries(data.verteilung)) {
                if (paddockName.toLowerCase() === "stallgasse") continue;
                const kosten = ballen * data.preisProBallen;
                const anzahlPferde = paddockPferdeCount[paddockName] || 0;
                paddockKostenProPferd[paddockName] = anzahlPferde > 0 ? round2(kosten / anzahlPferde) : 0;
            }

            let altGesamtwert = 0;
            let anteilAltPferd = 0;
            let anteilNeuPferd = 0;
            let diffGutschriftAlt = 0;

            if (data.nachverrechnung && data.nachverrechnung.menge > 0 && stallgassePferdeList.length > 0) {
                altGesamtwert = data.nachverrechnung.menge * data.nachverrechnung.preis;
                const anzahlAltPferde = altePferdeList.length;
                const anzahlNeuPferde = neuePferdeList.length;
                const gesamtStallgasseAnzahl = stallgassePferdeList.length;

                if (anzahlAltPferde > 0 && anzahlNeuPferde > 0) {
                    anteilAltPferd = altGesamtwert / anzahlAltPferde;
                    anteilNeuPferd = round2(altGesamtwert / gesamtStallgasseAnzahl);
                    diffGutschriftAlt = round2(anteilAltPferd - anteilNeuPferd);
                } else if (anzahlAltPferde === 0 && anzahlNeuPferde > 0) {
                    anteilNeuPferd = round2(altGesamtwert / gesamtStallgasseAnzahl);
                }
            }

            let totalBallen = 0;
            let verteilungText = "";
            for (const [ort, ballen] of Object.entries(data.verteilung)) {
                totalBallen += ballen;
                verteilungText += `  • ${ort}: ${ballen} Ballen\n`;
            }

            // WhatsApp Text ohne Kontrollsumme
            let chatText = `🌾 *Heu-Abrechnung*\n\n`;
            chatText += `🚚 Anfahrt gesamt: ${data.anfahrtKosten.toFixed(2)}€ (${anfahrtProPferd.toFixed(2)}€ pro Pferd)\n`;
            chatText += `📦 Ballenpreis (aktuell): ${data.preisProBallen.toFixed(2)}€\n`;
            chatText += `🌾 Gesamtballen (aktuell): ${totalBallen} Stück\n`;
            chatText += `📍 Verteilung:\n${verteilungText}\n`;

            if (data.nachverrechnung && data.nachverrechnung.menge > 0 && neuePferdeList.length > 0) {
                chatText += `🔄 *Nachverrechnung Alt-Heu (${data.nachverrechnung.menge} Ballen à ${data.nachverrechnung.preis.toFixed(2)}€ = ${altGesamtwert.toFixed(2)}€):*\n`;
                chatText += `  • Neu aufgeteilt auf ${stallgassePferdeList.length} Pferde (${anteilNeuPferd.toFixed(2)}€ pro Pferd)\n`;
                chatText += `  • Gutschrift für ${altePferdeList.length} Bestands-Pferd(e): -${diffGutschriftAlt.toFixed(2)}€ p.P.\n`;
                chatText += `  • Anteil für ${neuePferdeList.length} neue Pferd(e): +${anteilNeuPferd.toFixed(2)}€ p.P.\n\n`;
            }

            let csvText = `Besitzer;Pferd;Anfahrt (€);Stallgasse (€);Paddock Name;Paddock (€);Alt-Heu Ausgleich (€);Gesamt Pferd (€);Gesamt Besitzer (€)\n`;
            
            let tableHTML = `<table>
                <thead>
                    <tr>
                        <th>Besitzer</th>
                        <th>Pferd</th>
                        <th>Anfahrt (€)</th>
                        <th>Stallgasse (€)</th>
                        <th>Paddock</th>
                        <th>Paddock (€)</th>
                        <th>Alt-Heu Ausgleich (€)</th>
                        <th>Gesamt Pferd (€)</th>
                        <th>Gesamt Besitzer (€)</th>
                    </tr>
                </thead>
                <tbody>`;

            let grandTotal = 0;

            data.besitzer.forEach(besitzer => {
                let besitzerTotal = 0;
                let besitzerChat = `👤 *${besitzer.name}*\n`;
                let besitzerZeilenDaten = [];

                besitzer.pferde.forEach(pferd => {
                    let pferdTotal = anfahrtProPferd;
                    let teile = [`Anfahrt: ${anfahrtProPferd.toFixed(2)}€`];
                    
                    let pferdStallKosten = 0;
                    if (pferd.stallgasse) {
                        pferdStallKosten = stallgasseProPferd;
                        pferdTotal = round2(pferdTotal + pferdStallKosten);
                        teile.push(`Stallgasse: ${pferdStallKosten.toFixed(2)}€`);
                    }

                    let pferdAltDiff = 0;
                    if (pferd.stallgasse && data.nachverrechnung && data.nachverrechnung.menge > 0) {
                        if (pferd.neu) {
                            pferdAltDiff = anteilNeuPferd;
                            pferdTotal = round2(pferdTotal + pferdAltDiff);
                            teile.push(`Alt-Heu Anteil: +${pferdAltDiff.toFixed(2)}€`);
                        } else if (neuePferdeList.length > 0) {
                            pferdAltDiff = -diffGutschriftAlt;
                            pferdTotal = round2(pferdTotal + pferdAltDiff);
                            teile.push(`Alt-Heu Gutschrift: -${Math.abs(pferdAltDiff).toFixed(2)}€`);
                        }
                    }

                    let pferdPaddockKosten = 0;
                    if (pferd.paddock && paddockKostenProPferd[pferd.paddock]) {
                        pferdPaddockKosten = paddockKostenProPferd[pferd.paddock];
                        pferdTotal = round2(pferdTotal + pferdPaddockKosten);
                        teile.push(`${pferd.paddock}: ${pferdPaddockKosten.toFixed(2)}€`);
                    }

                    besitzerTotal = round2(besitzerTotal + pferdTotal);
                    besitzerChat += `  🐴 ${pferd.name}: ${pferdTotal.toFixed(2)}€ (${teile.join(' + ')})\n`;
                    
                    besitzerZeilenDaten.push({
                        besitzerName: besitzer.name,
                        pferdName: pferd.name,
                        anfahrt: anfahrtProPferd.toFixed(2),
                        stallgasse: pferdStallKosten.toFixed(2),
                        paddockName: pferd.paddock || '-',
                        paddockKosten: pferdPaddockKosten.toFixed(2),
                        altDiff: pferdAltDiff.toFixed(2),
                        pferdTotal: pferdTotal.toFixed(2)
                    });
                });

                grandTotal = round2(grandTotal + besitzerTotal);
                besitzerChat = besitzerChat.replace(`\n`, ` -> *Gesamt: ${besitzerTotal.toFixed(2)}€*\n`);
                chatText += besitzerChat + `\n`;

                besitzerZeilenDaten.forEach((z, index) => {
                    let istErsteZeile = (index === 0);
                    let rowSpan = istErsteZeile ? ` rowspan="${besitzerZeilenDaten.length}" style="vertical-align: top; font-weight: bold;"` : '';
                    let formatBesitzerTotal = istErsteZeile ? besitzerTotal.toFixed(2) : "";

                    csvText += `${z.besitzerName};${z.pferdName};${z.anfahrt};${z.stallgasse};${z.paddockName};${z.paddockKosten};${z.altDiff};${z.pferdTotal};${formatBesitzerTotal}\n`;

                    tableHTML += `<tr>`;
                    if (istErsteZeile) tableHTML += `<td${rowSpan}>${z.besitzerName}</td>`;
                    tableHTML += `
                        <td>${z.pferdName}</td>
                        <td>${z.anfahrt}</td>
                        <td>${z.stallgasse}</td>
                        <td>${z.paddockName}</td>
                        <td>${z.paddockKosten}</td>
                        <td>${z.altDiff}</td>
                        <td><strong>${z.pferdTotal}</strong></td>
                    `;
                    if (istErsteZeile) tableHTML += `<td${rowSpan}>${formatBesitzerTotal}</td>`;
                    tableHTML += `</tr>`;
                });
            });

            // Kontrollrechnung für Tabelle & CSV behalten
            let expectedTotal = round2(data.anfahrtKosten + (totalBallen * data.preisProBallen));
            let diffTotal = round2(grandTotal - expectedTotal);

            tableHTML += `
                <tfoot>
                    <tr style="background-color: #e8f4f8; color: #2c3e50;">
                        <td colspan="8" style="text-align: right; font-weight: bold; border-right: none;">Gesamtsumme aller Besitzer:</td>
                        <td style="font-weight: bold; border-left: none;">${grandTotal.toFixed(2)} €</td>
                    </tr>
                    <tr style="background-color: #f9f9f9; color: #666;">
                        <td colspan="8" style="text-align: right; font-size: 13px; border-right: none;">Kontrolle (Soll-Summe aus Anfahrt + aktuelle Ballen):</td>
                        <td style="font-size: 13px; border-left: none;">${expectedTotal.toFixed(2)} € <br><small>(Rundungs-Diff: ${diffTotal.toFixed(2)} €)</small></td>
                    </tr>
                </tfoot>
            </tbody></table>`;

            csvText += `\n;;;;;;;Gesamtsumme aller Besitzer:;${grandTotal.toFixed(2)}\n`;
            csvText += `;;;;;;;Kontrolle (Soll):;${expectedTotal.toFixed(2)}\n`;
            csvText += `;;;;;;;Rundungsdifferenz:;${diffTotal.toFixed(2)}\n`;

            document.getElementById('chatOutput').value = chatText;
            document.getElementById('tableContainer').innerHTML = tableHTML;
            document.getElementById('downloadCsvBtn').style.display = 'flex';
            document.getElementById('copyChatBtn').style.display = 'flex';
            
            const btn = document.getElementById('downloadCsvBtn');
            const newBtn = btn.cloneNode(true);
            btn.parentNode.replaceChild(newBtn, btn);
            
            newBtn.addEventListener('click', function() {
                const bom = "\uFEFF"; 
                const blob = new Blob([bom + csvText], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'heubestellung_abrechnung.csv';
                a.click();
                URL.revokeObjectURL(url);
            });
        }
    </script>
</body>
</html>
